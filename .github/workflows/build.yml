name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

env:
  QT_VERSION: '6.10.1'

jobs:
  linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          modules: qtmultimedia
          cache: true
      - name: Install build deps
        run: sudo apt-get update && sudo apt-get install -y ninja-build libxkbcommon-x11-0 libxcb-cursor0 libfuse2 libpulse0 libgl1-mesa-dev ffmpeg
      - name: Build
        run: |
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=/usr
          cmake --build build
          DESTDIR=$PWD/AppDir cmake --install build
      - name: Smoke test parser
        run: |
          python3 tools/make_sample.py sample.mp4 10
          ./build/dashgps-cli --info sample.mp4
          ./build/dashgps-cli -f gpx sample.mp4 | grep -c trkpt | grep -q '^10$'
      - name: AppImage
        run: |
          wget -q https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          wget -q https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/continuous/linuxdeploy-plugin-qt-x86_64.AppImage
          chmod +x linuxdeploy*.AppImage
          export QMAKE=$(which qmake6 || which qmake)
          export EXTRA_QT_PLUGINS="multimedia"
          PLUG=$(dirname $(dirname $QMAKE))/plugins/platforms
          ls $PLUG
          export EXTRA_PLATFORM_PLUGINS=$(cd $PLUG && ls libqwayland*.so 2>/dev/null | paste -sd ';')
          ./linuxdeploy-x86_64.AppImage --appdir AppDir --plugin qt --output appimage \
            -d AppDir/usr/share/applications/dashgps.desktop -i AppDir/usr/share/icons/hicolor/scalable/apps/dashgps.svg
          mv DashGPS*.AppImage DashGPS-linux-x86_64.AppImage
      - uses: actions/upload-artifact@v4
        with:
          name: DashGPS-linux
          path: DashGPS-linux-x86_64.AppImage

  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          arch: win64_msvc2022_64
          modules: qtmultimedia
          cache: true
      - uses: ilammy/msvc-dev-cmd@v1
      - name: Build
        run: |
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build
      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory dist/DashGPS | Out-Null
          Copy-Item build/dashgps.exe, build/dashgps-cli.exe dist/DashGPS/
          windeployqt --release --no-translations dist/DashGPS/dashgps.exe
          Compress-Archive dist/DashGPS DashGPS-windows-x64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: DashGPS-windows
          path: DashGPS-windows-x64.zip

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          modules: qtmultimedia
          cache: true
      - name: Build
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"
          cmake --build build -j4
      - name: Package
        run: |
          cp build/dashgps-cli build/dashgps.app/Contents/MacOS/
          macdeployqt build/dashgps.app -dmg
          mv build/dashgps.dmg DashGPS-macos.dmg
      - uses: actions/upload-artifact@v4
        with:
          name: DashGPS-macos
          path: DashGPS-macos.dmg

  release:
    # main -> rolling "nightly" pre-release; tag v* -> proper release
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    needs: [linux, windows, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - name: Nightly pre-release
        if: github.ref == 'refs/heads/main'
        run: |
          gh release delete nightly --cleanup-tag -y || true
          gh release create nightly --prerelease --latest=false --target "$GITHUB_SHA" \
            --title "Nightly build ($(date -u +%Y-%m-%d), ${GITHUB_SHA::7})" \
            --notes "Automatic build of the latest code on main. May be unstable; for the stable version use the newest normal release." \
            DashGPS-linux-x86_64.AppImage DashGPS-windows-x64.zip DashGPS-macos.dmg
      - name: Tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          gh release create "$GITHUB_REF_NAME" --title "DashGPS ${GITHUB_REF_NAME#v}" --generate-notes \
            DashGPS-linux-x86_64.AppImage DashGPS-windows-x64.zip DashGPS-macos.dmg
